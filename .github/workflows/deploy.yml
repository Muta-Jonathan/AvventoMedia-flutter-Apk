name: Deploy to App Stores

# Push a tag like v2.0.0 (must match `version:` in pubspec.yaml) to send the
# build to Google Play production and TestFlight. Production waits for approval
# on the `production` GitHub environment. Run manually to pick another track.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      play_track:
        description: 'Google Play Track'
        required: true
        default: 'production'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      deploy_ios:
        description: 'Deploy to TestFlight?'
        required: true
        type: boolean
        default: true
      deploy_android:
        description: 'Deploy to Google Play?'
        required: true
        type: boolean
        default: true

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.5'
  # Store build numbers must only go up. Offset keeps us above the manual
  # uploads (pubspec build number) made before this workflow existed.
  BUILD_NUMBER: ${{ 1000 + github.run_number }}

jobs:
  verify:
    name: Verify (analyze, tests, version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pubspec version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          PUBSPEC=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+[:space:]]+).*/\1/')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PUBSPEC" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $PUBSPEC"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create .env
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          if [ -n "$DOTENV" ]; then
            printf '%s\n' "$DOTENV" > .env
          else
            echo "::error::DOTENV secret is required to deploy"
            exit 1
          fi

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit & widget tests
        run: flutter test

  build_and_deploy_android:
    name: Build & Deploy Android
    needs: verify
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_android == 'true' }}
    runs-on: ubuntu-latest
    # `production` requires a reviewer (repo Settings > Environments).
    environment: ${{ (github.event.inputs.play_track || 'production') == 'production' && 'production' || 'play-test' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Create .env
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: printf '%s\n' "$DOTENV" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      # storeFile is resolved relative to the android/app module.
      - name: Create key.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Build Android App Bundle
        run: flutter build appbundle --release --build-number=${{ env.BUILD_NUMBER }}

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: tv.avventomedia.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.play_track || 'production' }}
          status: completed

  build_and_deploy_ios:
    name: Build & Deploy iOS
    needs: verify
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_ios == 'true' }}
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Create .env
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: printf '%s\n' "$DOTENV" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "temp-keychain-password"
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

          # Profile name + UUID are needed to sign and export by hand.
          security cms -D -i $PP_PATH > $RUNNER_TEMP/pp.plist
          PP_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' $RUNNER_TEMP/pp.plist)
          echo "PP_NAME=$PP_NAME" >> $GITHUB_ENV

      # The project uses Automatic + Apple Development signing for local
      # runs; CI has only the distribution cert and profile.
      - name: Switch Runner to manual distribution signing
        run: |
          PBX=ios/Runner.xcodeproj/project.pbxproj
          sed -i '' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/' \
            -e 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "Apple Distribution";/' \
            -e "s/PROVISIONING_PROFILE_SPECIFIER = \"\";/PROVISIONING_PROFILE_SPECIFIER = \"$PP_NAME\";/" \
            $PBX

          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>JCFVAVDU27</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>tv.avventomedia.org</key><string>$PP_NAME</string></dict>
          </dict>
          </plist>
          EOF

      - name: Build iOS App
        run: |
          flutter build ipa --release \
            --build-number=${{ env.BUILD_NUMBER }} \
            --export-options-plist=$RUNNER_TEMP/ExportOptions.plist

      - name: Upload to App Store Connect
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          # altool looks for AuthKey_<id>.p8 in this folder.
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8

          xcrun altool --upload-app -f build/ios/ipa/*.ipa \
            -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            --show-progress
